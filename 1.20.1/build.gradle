plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'

    base {
        // e.g. helldivers_ping-fabric-1.0.0+1.20.1.jar
        archivesName = "$rootProject.archives_name-$project.name"
    }

    version = "$rootProject.mod_version+$rootProject.minecraft_version"

    repositories {
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.parchmentmc.org' }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        // Parchment also keeps the layered mapping hash unique per Minecraft version; with plain
        // officialMojangMappings() both versions share one cached mappings artifact and corrupt each other.
        mappings loom.layered {
            it.officialMojangMappings()
            it.parchment("org.parchmentmc.data:parchment-$rootProject.minecraft_version:$rootProject.parchment_version@zip")
        }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 17
    }
}
